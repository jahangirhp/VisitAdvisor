<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <title>VisitAdvisor</title>
  <link rel="stylesheet" href="./camera.css">
  <script type="module" src="./camera.mjs"></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./">VisitAdvisor</a>
      <details class="menu" id="menu">
        <summary aria-label="Location and settings"><span aria-hidden="true">☰</span></summary>
        <div class="menu-panel">
          <label for="location">Location</label>
          <select id="location" disabled><option>Loading…</option></select>
          <p id="target-note" hidden></p>
          <p class="privacy-note">Camera crops are sent to VisitAdvisor while scanning. Images are not saved.</p>
        </div>
      </details>
    </header>
    <section class="capture-bar" aria-label="Camera controls">
      <div class="viewer" role="button" tabindex="0" aria-label="Expand camera preview" aria-expanded="false">
        <video id="camera" autoplay playsinline muted></video>
        <div id="placeholder"><span class="camera-icon" aria-hidden="true">◎</span></div>
        <div class="guide" aria-hidden="true"></div>
        <span id="live-label" hidden>LIVE</span>
      </div>
      <div class="controls">
        <button id="start" disabled>Start</button>
        <button id="stop" class="secondary" hidden>Stop</button>
        <span class="capture-hint">Point at an object</span>
      </div>
    </section>
    <section class="detection" aria-label="Detection">
      <h1>Detection</h1>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <p id="phone-setup" hidden><a href="./phone-setup.html">Set up camera access</a></p>
      <section id="result" class="result" hidden aria-live="polite">
        <p id="result-kind" class="eyebrow">POSSIBLE MATCH · PLEASE VERIFY</p>
        <h2 id="object-name"></h2><p id="object-meta"></p><p id="object-description"></p>
        <div id="sources"></div>
        <div id="experience" hidden></div>
      </section>
    </section>
  </main>
</body>
</html>
