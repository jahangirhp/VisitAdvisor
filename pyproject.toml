[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visitadvisor"
version = "0.1.0"
description = "VisitAdvisor location, object, and source API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pymongo>=4.13,<5",
    "httpx>=0.27,<1",
    "pillow>=12.1,<13",
    "python-multipart>=0.0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.13,<2"]
visual = ["torch>=2.6,<3", "transformers>=4.57,<5", "opencv-python-headless>=4.10,<5"]
camera-server = ["onnxruntime>=1.20,<2", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]
camera = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
capture-server = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.57,<5"]

[tool.setuptools.package-data]
"app.modules.live_camera" = ["static/*"]
"app.modules.admin" = ["static/*"]
"app.modules.visual" = ["static/*"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
