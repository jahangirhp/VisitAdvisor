# Generate the Xcode project on a Mac:  brew install xcodegen && cd ios && xcodegen
name: VisitAdvisor
options:
  bundleIdPrefix: com.steeltrace.visitadvisor
  deploymentTarget:
    iOS: "17.2"  # Meta Wearables DAT minimum
packages:
  VisitAdvisorKit:
    path: VisitAdvisorKit
  # Ray-Ban Meta camera streaming (developer preview; not App Store publishable yet).
  MWDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    exactVersion: 1.1.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    VISITADVISOR_API_BASE_URL: https://visitadvisor-api-t4ckjib5aq-ez.a.run.app
targets:
  VisitAdvisor:
    type: application
    platform: iOS
    sources:
      - path: VisitAdvisorApp/Sources
      - path: VisitAdvisorApp/OpenCV
      - path: VisitAdvisorApp/Resources/Info.plist
        buildPhase: none
      - path: VisitAdvisorApp/Resources/VisitAdvisor.entitlements
        buildPhase: none
      # Produced by scripts/convert_dinov2_coreml.py; Xcode compiles it to .mlmodelc.
      - path: VisitAdvisorApp/Models
        optional: true
    dependencies:
      - package: VisitAdvisorKit
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATMockDevice
      # Built by ios/scripts/build_opencv.sh (pinned to the server's OpenCV 4.14.0).
      - framework: Vendor/opencv2.xcframework
        embed: false
    settings:
      base:
        INFOPLIST_FILE: VisitAdvisorApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VisitAdvisorApp/Resources/VisitAdvisor.entitlements
        # Empty in Developer Mode; set from the Wearables Developer Center for release channels.
        META_APP_ID: ""
        META_CLIENT_TOKEN: ""
        SWIFT_OBJC_BRIDGING_HEADER: VisitAdvisorApp/Sources/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/VisitAdvisorApp/OpenCV
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        OTHER_LDFLAGS: -lc++
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Recognition is far too slow unoptimised; keep DEBUG features, optimise code.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -O
          GCC_OPTIMIZATION_LEVEL: "3"
